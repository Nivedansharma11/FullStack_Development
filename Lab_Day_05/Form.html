    <form action="./SignUp.html" method="get" >
        <label for="name">Enter Your Name :</label>
        <input type="text" placeholder="Enter your Name" id="name" name="name" required minlength="2" maxlength="20">

    <br><br>
        <label for="age">Enter Your Age :</label>
        <input type="number" placeholder="Enter Your Age" id="age" name="age" required min="1" max="150"> 


    <br><br>
        <label for="email">Enter Your Email :</label>
        <input type="email" placeholder="Enter Your Email" id="email" name="email" required min="1" max="150"> 

    <br><br>
        <label for="pw">Enter your password </label>
        <input type="password" name="password" id="pw" minlength="8" required maxlength="30">

</form>
